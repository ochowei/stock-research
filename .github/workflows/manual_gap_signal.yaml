name: Manual Gap Signal Generator

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run (default: current)'
        required: false
        default: ''
        
  schedule:
    - cron: '6 13 * * 1-5'

jobs:
  # 這是原本執行的 v6.2.6_rc 版本
  run-gap-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r V6.2/exp/requirements.txt

      - name: Run Daily Gap Signal Generator RC
        working-directory: ./V6.2/exp
        run: |
          python daily_gap_signal_generator_v6_2_6_rc.py

      - name: Upload Results RC
        uses: actions/upload-artifact@v4
        with:
          name: gap-signal-report-v6.2.6-rc
          path: V6.2/exp/output/*.csv
          retention-days: 5

  # --- 這是新增的 Job：執行 v6.2.1 版本 ---
  run-gap-signal-v6-2-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r V6.2/exp/requirements.txt

      - name: Run Daily Gap Signal Generator v6.2.1
        working-directory: ./V6.2/exp
        run: |
          # 執行你指定的版本
          python daily_gap_signal_generator_v6_2_1.py

      - name: Upload Results v6.2.1
        uses: actions/upload-artifact@v4
        with:
          name: gap-signal-report-v6.2.1
          path: V6.2/exp/output/*.csv
          retention-days: 5
